<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Ilustracion de un grupo jugando alrededor de una mesa con una carta de interrogacion en el centro">
  <g fill="none" stroke="#1c1917" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- mesa -->
    <ellipse cx="320" cy="360" rx="240" ry="150" fill="#f7e6c2" />

    <!-- manos desde los bordes -->
    <path d="M40 320c30-10 60-6 84 14 18 15 26 34 26 34" />
    <path d="M600 320c-30-10-60-6-84 14-18 15-26 34-26 34" />
    <path d="M230 540c-6-30 4-58 28-78 17-14 37-18 37-18" />
    <path d="M410 540c6-30-4-58-28-78-17-14-37-18-37-18" />

    <!-- carta central -->
    <g transform="translate(320 330)">
      <rect x="-72" y="-100" width="144" height="200" rx="16" fill="#faf6ee" stroke="#1c1917" stroke-width="10" />
      <path d="M-18 -46c0-20 16-34 34-34s34 13 34 32c0 22-20 26-30 40-4 6-6 12-6 20" stroke-width="11" />
      <circle cx="16" cy="24" r="3" fill="#1c1917" stroke="none" />
    </g>

    <!-- simbolos flotando: luna (oscuro), espiral (surreal), rayo (cortito) -->
    <g transform="translate(120 150)">
      <path d="M18 0c-14 0-24 12-24 26 0 15 11 21 24 39 13-18 24-24 24-39C42 12 32 0 18 0Z" />
    </g>
    <g transform="translate(500 130) scale(0.9)">
      <path d="M28 46a26 26 0 1 1 17-45" />
    </g>
    <g transform="translate(470 260) scale(0.8)">
      <path d="M30 0 6 40h24l-6 34 36-46h-24Z" />
    </g>
  </g>
</svg>
