<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0d0d0f"/>
  <!-- Fondo gradiente sutil -->
  <radialGradient id="bg1" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#1a0a0a" stop-opacity="1"/>
    <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
  </radialGradient>
  <rect width="800" height="500" fill="url(#bg1)"/>

  <!-- Muñeco de nieve simplificado, línea fina -->
  <g opacity="0.25" stroke="#e4e4e7" stroke-width="1.2" stroke-linecap="round">
    <!-- Cuerpo inferior -->
    <circle cx="400" cy="340" r="80"/>
    <!-- Cuerpo medio -->
    <circle cx="400" cy="230" r="55"/>
    <!-- Cabeza -->
    <circle cx="400" cy="150" r="38"/>
    <!-- Ojos -->
    <circle cx="388" cy="143" r="4" fill="#e4e4e7" stroke="none" opacity="0.4"/>
    <circle cx="412" cy="143" r="4" fill="#e4e4e7" stroke="none" opacity="0.4"/>
    <!-- Nariz (zanahoria) — arrancada, solo trazo -->
    <line x1="400" y1="155" x2="418" y2="162" stroke="#dc2626" stroke-width="2" opacity="0.6"/>
    <!-- Botones -->
    <circle cx="400" cy="245" r="3" fill="#e4e4e7" stroke="none" opacity="0.3"/>
    <circle cx="400" cy="265" r="3" fill="#e4e4e7" stroke="none" opacity="0.3"/>
    <!-- Brazos -->
    <line x1="345" y1="220" x2="295" y2="195"/>
    <line x1="455" y1="220" x2="505" y2="195"/>
    <!-- Sombrero -->
    <rect x="370" y="105" width="60" height="35" rx="2"/>
    <line x1="355" y1="112" x2="445" y2="112"/>
  </g>

  <!-- Liebre minimalista, derecha -->
  <g opacity="0.15" stroke="#e4e4e7" stroke-width="1" stroke-linecap="round">
    <ellipse cx="630" cy="350" rx="22" ry="14"/>
    <circle cx="630" cy="325" r="12"/>
    <!-- Orejas -->
    <line x1="624" y1="314" x2="618" y2="285"/>
    <line x1="636" y1="314" x2="644" y2="283"/>
    <!-- Patas -->
    <line x1="615" y1="360" x2="608" y2="378"/>
    <line x1="645" y1="360" x2="652" y2="378"/>
  </g>

  <!-- Texto atmosférico -->
  <text x="400" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3f3f46" letter-spacing="4">HISTORIAS NEGRAS</text>
</svg>
