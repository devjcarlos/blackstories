<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#09090b"/>
  <radialGradient id="bg3" cx="50%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#100808" stop-opacity="1"/>
    <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
  </radialGradient>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Ataúd -->
  <g opacity="0.2" stroke="#e4e4e7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 140 L340 120 L460 120 L490 140 L490 400 L310 400 Z"/>
    <!-- Cruz -->
    <line x1="400" y1="170" x2="400" y2="260"/>
    <line x1="365" y1="205" x2="435" y2="205"/>
    <!-- Tornillos -->
    <circle cx="325" cy="160" r="5"/>
    <circle cx="475" cy="160" r="5"/>
    <circle cx="325" cy="380" r="5"/>
    <circle cx="475" cy="380" r="5"/>
  </g>

  <!-- Fósforo encendido -->
  <g opacity="0.5">
    <!-- Palo -->
    <line x1="560" y1="340" x2="560" y2="220" stroke="#c4a46b" stroke-width="3" stroke-linecap="round"/>
    <!-- Llama -->
    <ellipse cx="560" cy="205" rx="8" ry="14" fill="#dc2626" opacity="0.8"/>
    <ellipse cx="560" cy="202" rx="5" ry="10" fill="#f97316" opacity="0.9"/>
    <ellipse cx="560" cy="200" rx="3" ry="6" fill="#fef08a" opacity="1"/>
    <!-- Resplandor -->
    <ellipse cx="560" cy="210" rx="40" ry="35" fill="#dc2626" opacity="0.04"/>
  </g>

  <!-- Silueta dentro del ataúd (muy sutil) -->
  <g opacity="0.08" fill="#e4e4e7">
    <ellipse cx="400" cy="190" rx="22" ry="18"/>
    <rect x="378" y="207" width="44" height="100" rx="10"/>
  </g>

  <text x="400" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3f3f46" letter-spacing="4">HISTORIAS NEGRAS</text>
</svg>
